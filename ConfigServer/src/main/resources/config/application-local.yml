datasource:
  driver-class-name: com.mysql.cj.jdbc.Driver
  url: jdbc:mysql://localhost:3306/com
  username: com
  password: com01
  hikari:
    maximum-pool-size: 20 # 각 서비스의 최대 연결 수 제한
    connection-timeout: 20000 # 연결을 얻기 위한 최대 대기 시간 (밀리초)
    idle-timeout: 30000 # 유휴 상태에서 연결을 유지할 시간 (밀리초)
    minimum-idle: 5 # 유휴 상태로 유지할 연결 수
    max-lifetime: 1800000 # 연결의 최대 수명 (밀리초)

jpa:
  hibernate:
    ddl-auto: none
  open-in-view: false
  show-sql: true
  properties:
    hibernate:
      format_sql: true

token:
  accessSecret: "${TOKEN_ACCESS_SECRET:}" # 256bit+ CSPRNG 랜덤 값 필수 (예: openssl rand -base64 32). 로컬 개발용 기본값 없음.
  refreshSecret: "${TOKEN_REFRESH_SECRET:}" # 256bit+ CSPRNG 랜덤 값 필수. accessSecret과 분리.
  accessExpiration: 7200000 # TTL (millisecond, 2 Hour)
  refreshExpiration: 86400000 # TTL (millisecond, 1 Day)

gateway:
  internalSecret: "${GATEWAY_INTERNAL_SECRET:}" # 256bit+ CSPRNG 랜덤 값 필수. token.accessSecret과 강제 분리. 미설정 시 기동 실패.

org:
  egovframe:
    crypto:
      algorithm: SHA-256
      algorithmKey: ${EGOV_CRYPTO_ALGORITHM_KEY:egovframe}
      algorithmKeyHash: ${EGOV_CRYPTO_ALGORITHM_KEY_HASH:gdyYs/IZqY86VcWhT8emCYfqY1ahw2vtLG+/FzNqtrQ=}
