name: Fork CI
on:
  pull_request:
    branches: [work]
  push:
    branches: [work]
permissions:
  contents: read
jobs:
  encoding:
    if: github.repository == 'leejongyoung/egovframe-msa-common-components'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # fork 전용 점검: tracked 텍스트 파일이 UTF-8 strict 로 읽히는지 확인한다.
      - name: Check source encoding
        run: python3 scripts/check_source_encoding.py
  build:
    if: github.repository == 'leejongyoung/egovframe-msa-common-components'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - ConfigServer
          - EurekaServer
          - GatewayServer
          - EgovAuthor
          - EgovBoard
          - EgovCmmnCode
          - EgovLogin
          - EgovLoginPolicy
          - EgovMain
          - EgovQuestionnaire
          - EgovSearch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build module
        run: mvn -B -ntp -f ${{ matrix.module }}/pom.xml package -DskipTests
