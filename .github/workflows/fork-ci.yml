name: Fork CI
on:
  pull_request:
    branches: [work]
  push:
    branches: [work]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'leejongyoung/egovframe-msa-common-components'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - ConfigServer
          - EurekaServer
          - GatewayServer
          - EgovAuthor
          - EgovBoard
          - EgovCmmnCode
          - EgovLogin
          - EgovLoginPolicy
          - EgovMain
          - EgovQuestionnaire
          - EgovSearch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build module
        run: mvn -B -ntp -f ${{ matrix.module }}/pom.xml package -DskipTests
